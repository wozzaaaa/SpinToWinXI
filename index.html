<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpinToWin XI - Ultimate Test Cricket Draft</title>
    <style>
        :root {
            --pitch-green: #1b4d3e;
            --stadium-grass: #2a6f57;
            --leather-red: #8b0000;
            --dusty-brown: #c2b280;
            --gold-accent: #ffd700;
            --ink-black: #111111;
            --paper-white: #f5f5f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--ink-black); color: var(--paper-white); padding: 10px; max-width: 600px; margin: 0 auto; }
        header { text-align: center; padding: 15px 0; border-bottom: 2px solid var(--stadium-grass); margin-bottom: 15px; }
        h1 { font-size: 1.8rem; color: var(--gold-accent); letter-spacing: 0.5px; }
        .tagline { font-size: 0.75rem; color: var(--stadium-grass); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; font-weight: bold; }
        .screen { display: none; background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .screen.active { display: block; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; }
        button { background: var(--stadium-grass); color: white; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--pitch-green); }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .slot-card { background: #222; padding: 10px; border-radius: 6px; border-left: 4px solid #555; font-size: 0.9rem; }
        .slot-card.filled { border-left-color: var(--gold-accent); background: #2d2d2d; }
        .wheel-container { text-align: center; margin: 15px 0; padding: 20px; background: #252525; border-radius: 8px; border: 2px dashed var(--gold-accent); }
        .jackpot-alert { color: var(--gold-accent); font-weight: bold; animation: flash 1s infinite alternate; display: none; margin: 10px 0; }
        @keyframes flash { from { opacity: 0.5; } to { opacity: 1; } }
        .search-container { margin: 10px 0; }
        .options-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .option-btn { background: #333; text-align: left; font-weight: normal; font-size: 0.9rem; }
        .option-btn:hover { background: #444; }
        .pitch-indicator { padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; margin: 15px 0; }
        .pitch-indicator.green { background: var(--pitch-green); color: white; }
        .pitch-indicator.flat { background: #b0c4de; color: #111; }
        .pitch-indicator.dusty { background: var(--dusty-brown); color: #111; }
        .hof-card { background: #2a2a2a; border: 1px solid var(--gold-accent); padding: 12px; margin: 10px 0; border-radius: 6px; }
        .trait-tag { display: inline-block; background: var(--leather-red); color: white; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-right: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🏏 SpinToWin XI</h1>
        <div class="tagline">The Ultimate Test Match Draft Simulator</div>
    </header>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="screen active">
        <h2>Manager Profile Setup</h2>
        <label>Manager Name:</label>
        <input type="text" id="mgr-name" placeholder="Enter your name..." value="G'day Skipper">
        
        <label>Your Country:</label>
        <select id="mgr-team">
            <option value="Australia" selected>Australia</option>
            <option value="India">India</option>
            <option value="England">England</option>
            <option value="West Indies">West Indies</option>
        </select>
        
        <label>Opponent Country:</label>
        <select id="opp-team">
            <option value="England" selected>England</option>
            <option value="India">India</option>
            <option value="Australia">Australia</option>
            <option value="West Indies">West Indies</option>
        </select>
        
        <button onclick="startDraft()">Begin Draft Career</button>
        <button onclick="showHOF()" style="background:#333; margin-top:15px;">View Hall of Fame</button>
    </div>

    <!-- DRAFT SCREEN -->
    <div id="draft-screen" class="screen">
        <h3 id="draft-title" style="color:var(--gold-accent); margin-bottom:10px;"></h3>
        <div class="wheel-container">
            <button id="spin-btn" onclick="spinWheel()">🎲 Spin Selection Wheel</button>
            <div id="spin-result" style="margin-top:10px; font-weight:bold; font-size:1.1rem;"></div>
            <div id="jackpot-box" class="jackpot-alert">⚡ RETRO LEGENDS JACKPOT DETECTED! ⚡</div>
        </div>

        <div id="selection-box" style="display:none;">
            <h4>Available Picks (Strict Nation Sync):</h4>
            <div class="search-container">
                <input type="text" id="player-search" placeholder="🔍 Search current pool manually..." oninput="filterOptions()">
            </div>
            <div id="options-container" class="options-list"></div>
        </div>

        <h4>Your Current XI</h4>
        <div id="roster-grid" class="grid"></div>
        <button id="sim-nav-btn" onclick="goToPress()" disabled style="margin-top:15px; background:var(--leather-red);">Advance to Series</button>
    </div>

    <!-- PRESS CONFERENCE SCREEN -->
    <div id="press-screen" class="screen">
        <h2>🎤 Pre-Series Press Conference</h2>
        <p id="press-question" style="margin:15px 0; font-style:italic; background:#222; padding:15px; border-radius:6px;"></p>
        <button onclick="answerPress(1)" id="press-opt1"></button>
        <button onclick="answerPress(2)" id="press-opt2"></button>
    </div>

    <!-- TOSS SCREEN -->
    <div id="toss-screen" class="screen">
        <h2 id="trophy-title">🏅 The Trophy Match</h2>
        <div id="pitch-view" class="pitch-indicator"></div>
        <h3>Call the Coin Toss</h3>
        <div style="display:flex; gap:10px;">
            <button onclick="executeToss('Heads')">🪙 Heads</button>
            <button onclick="executeToss('Tails')">🪙 Tails</button>
        </div>
        <div id="toss-result" style="margin:15px 0; font-weight:bold; text-align:center;"></div>
        <div id="toss-choice-box" style="display:none;">
            <button onclick="chooseTossAction('Bat First')">🏏 Elect to Bat First</button>
            <button onclick="chooseTossAction('Bowl First')">🥎 Elect to Bowl First</button>
        </div>
    </div>

    <!-- SIMULATION SCREEN -->
    <div id="sim-screen" class="screen">
        <h2>🏏 Series Scorecard & Logs</h2>
        <div id="simulation-logs" style="max-height:300px; overflow-y:auto; background:#111; padding:12px; font-family:monospace; font-size:0.85rem; border-radius:6px; margin:15px 0; line-height:1.4;"></div>
        <button onclick="archiveAndFinish()">Complete Series & Save to Hall of Fame</button>
    </div>

    <!-- HALL OF FAME SCREEN -->
    <div id="hof-screen" class="screen">
        <h2>🏆 All-Time XI Hall of Fame</h2>
        <div id="hof-list"></div>
        <button onclick="exitHOF()" style="margin-top:15px;">Return to Setup</button>
    </div>

    <script>
        let mgrName = "", mgrTeam = "", oppTeam = "", trophyName = "";
        let currentSquad = [null, null, null, null, null, null, null, null, null, null, null];
        let activePoolOptions = [];

            { id: 4, label: "5. Middle-Order Stroke" },
            { id: 5, label: "6. Wicketkeeper (WK)" },
            { id: 6, label: "7. All-Rounder" },
            { id: 7, label: "8. All-Rounder" },
            { id: 8, label: "9. Fast Bowler" },

            "West Indies_1980s": [
                { name: "Gordon Greenidge", role: "Opener", rating: 93, country: "West Indies" },
