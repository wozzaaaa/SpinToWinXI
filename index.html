<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpinToWin XI - Test Cricket Draft</title>
    <style>
        :root {
            --pitch-green: #1b4d3e;
            --stadium-grass: #2a6f57;
            --leather-red: #8b0000;
            --dusty-brown: #c2b280;
            --gold-accent: #ffd700;
            --ink-black: #111111;
            --paper-white: #f5f5f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--ink-black); color: var(--paper-white); padding: 15px; max-width: 600px; margin: 0 auto; }
        header { text-align: center; padding: 15px 0; border-bottom: 2px solid var(--stadium-grass); margin-bottom: 15px; }
        h1 { color: var(--gold-accent); }
        .screen { display: none; background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
        .screen.active { display: block; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; }
        button { background: var(--stadium-grass); color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: var(--pitch-green); }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.5; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .slot-card { background: #222; padding: 10px; border-radius: 6px; border-left: 4px solid #555; font-size: 0.9rem; }
        .slot-card.filled { border-left-color: var(--gold-accent); background: #2d2d2d; }
        .wheel-container { text-align: center; margin: 15px 0; padding: 20px; background: #252525; border-radius: 8px; border: 2px dashed var(--gold-accent); }
        .options-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .option-item { background: #2a2a2a; border: 1px solid #444; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .option-item select { width: auto; display: inline-block; padding: 6px; margin: 0 10px; }
        .option-item button { width: auto; display: inline-block; padding: 6px 12px; margin: 0; background: var(--leather-red); }
        .pitch-indicator { padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; margin: 15px 0; background: var(--pitch-green); }
        .hof-card { background: #2a2a2a; border: 1px solid var(--gold-accent); padding: 12px; margin: 10px 0; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>🏏 SpinToWin XI</h1>
        <p style="color: var(--stadium-grass); font-weight: bold;">The Ultimate Cricket Draft Simulator</p>
    </header>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="screen active">
        <h2>Manager Profile Setup</h2>
        <label>Manager Name:</label>
        <input type="text" id="mgr-name" value="G'day Skipper">
        
        <label>Your Country:</label>
        <select id="mgr-team">
            <option value="Australia" selected>Australia</option>
            <option value="India">India</option>
            <option value="England">England</option>
            <option value="West Indies">West Indies</option>
        </select>
        
        <label>Opponent Country:</label>
        <select id="opp-team">
            <option value="England" selected>England</option>
            <option value="India">India</option>
            <option value="Australia">Australia</option>
            <option value="West Indies">West Indies</option>
        </select>
        
        <button onclick="startDraft()">Begin Draft Career</button>
        <button onclick="showHOF()" style="background:#333;">View Hall of Fame</button>
    </div>

    <!-- DRAFT SCREEN -->
    <div id="draft-screen" class="screen">
        <h3 id="draft-title" style="color:var(--gold-accent);"></h3>
        <div class="wheel-container">
            <button id="spin-btn" onclick="spinWheel()">🎲 Spin Selection Wheel</button>
            <div id="spin-result" style="margin-top:10px; font-weight:bold;"></div>
        </div>

        <div id="selection-box" style="display:none;">
            <h4>Available Picks:</h4>
            <div id="options-container" class="options-list"></div>
        </div>

        <h4>Your Current XI</h4>
        <div id="roster-grid" class="grid"></div>
        <button id="sim-nav-btn" onclick="goToPress()" disabled style="background:var(--leather-red);">Advance to Match Series</button>
    </div>

    <!-- PRESS CONFERENCE SCREEN -->
    <div id="press-screen" class="screen">
        <h2>🎤 Pre-Series Press Conference</h2>
        <p id="press-question" style="margin:15px 0; font-style:italic; background:#222; padding:15px; border-radius:6px;"></p>
        <button onclick="answerPress(4)">Defend players publicly (+4 Squad Morale)</button>
        <button onclick="answerPress(-2)">Demand higher work ethic (-2 Squad Morale)</button>
    </div>

    <!-- TOSS SCREEN -->
    <div id="toss-screen" class="screen">
        <h2>Coin Toss Match Day</h2>
        <div id="pitch-view" class="pitch-indicator">📋 Flat Batting Track (Bright Sunshine)</div>
        <h3>Call the Coin Toss</h3>
        <button onclick="executeToss()">🪙 Flip Coin</button>
        <div id="toss-result" style="margin:15px 0; font-weight:bold; text-align:center;"></div>
    </div>

    <!-- SIMULATION SCREEN -->
    <div id="sim-screen" class="screen">
        <h2>🏏 Series Scorecard & Logs</h2>
        <div id="simulation-logs" style="background:#111; padding:12px; font-family:monospace; border-radius:6px; margin:15px 0; max-height: 250px; overflow-y: auto;"></div>
        <button onclick="archiveAndFinish()">Complete Campaign & Save Results</button>
    </div>

    <!-- HALL OF FAME SCREEN -->
    <div id="hof-screen" class="screen">
        <h2>🏆 All-Time XI Hall of Fame</h2>
        <div id="hof-list"></div>
        <button onclick="exitHOF()" style="margin-top:15px;">Return to Setup</button>
    </div>

    <script>
        let mgrName = "", mgrTeam = "", oppTeam = "", trophyName = "";
        
        // Direct, non-nested state tracking to block script failures
        let p0 = null, p1 = null, p2 = null, p3 = null, p4 = null, p5 = null, p6 = null, p7 = null, p8 = null, p9 = null, p10 = null;
        let moraleModifier = 0;

        const playersDatabase = [
            { name: "Sir Don Bradman", rating: 99, country: "Australia" },
            { name: "Sunil Gavaskar", rating: 95, country: "India" },
            { name: "Sachin Tendulkar", rating: 98, country: "India" },
            { name: "Sir Viv Richards", rating: 96, country: "West Indies" },
            { name: "Brian Lara", rating: 95, country: "West Indies" },
            { name: "Adam Gilchrist", rating: 94, country: "Australia" },
            { name: "MS Dhoni", rating: 92, country: "India" },
            { name: "Sir Garfield Sobers", rating: 97, country: "West Indies" },
            { name: "Jacques Kallis", rating: 96, country: "South Africa" },
            { name: "Shane Warne", rating: 95, country: "Australia" },
            { name: "Muttiah Muralitharan", rating: 96, country: "Sri Lanka" },
            { name: "Glenn McGrath", rating: 95, country: "Australia" },
            { name: "Wasim Akram", rating: 96, country: "Pakistan" },
            { name: "James Anderson", rating: 93, country: "England" },
            { name: "Sir Alastair Cook", rating: 91, country: "England" },
            { name: "Matthew Hayden", rating: 92, country: "Australia" }
        ];

        function renderRosterSlots() {
            const grid = document.getElementById("roster-grid");
            grid.innerHTML = "";

            let slots = [
                { val: p0, label: "1. Opener (Bat)" },
                { val: p1, label: "2. Opener (Bat)" },
                { val: p2, label: "3. Top-Order Anchor" },
                { val: p3, label: "4. Middle-Order Stroke" },
                { val: p4, label: "5. Middle-Order Stroke" },
                { val: p5, label: "6. Wicketkeeper (WK)" },
                { val: p6, label: "7. All-Rounder" },
                { val: p7, label: "8. All-Rounder" },
                { val: p8, label: "9. Fast Bowler" },
                { val: p9, label: "10. Fast Bowler" },
                { val: p10, label: "11. Specialist Spinner" }
            ];

            let count = 0;
            slots.forEach(s => {
                const div = document.createElement("div");
                div.className = "slot-card " + (s.val ? "filled" : "");
                if (s.val) {
                    div.innerHTML = "<strong>" + s.label + ":</strong><br>" + s.val.name + " (" + s.val.rating + ")";
                    count++;
                } else {
                    div.innerHTML = "<strong>" + s.label + "</strong><br><span style='color:#777;'>Empty</span>";
                }
                grid.appendChild(div);
            });

            document.getElementById("sim-nav-btn").disabled = (count < 11);
        }

        function startDraft() {
            mgrName = document.getElementById("mgr-name").value || "Skipper";
            mgrTeam = document.getElementById("mgr-team").value;
            oppTeam = document.getElementById("opp-team").value;

            if (mgrTeam === oppTeam) {
                alert("Please pick a different Opponent Country! You can't play against your own nation.");
                return;
            }

            trophyName = "The World Test Championship Shield";
            if ((mgrTeam === "Australia" && oppTeam === "England") || (mgrTeam === "England" && oppTeam === "Australia")) trophyName = "The Ashes";
